type Swap @entity {
  id: ID!
  sender: Bytes!
  amountIn: BigInt!
  timestamp: BigInt!
}

type Deposit @entity {
  id: ID!
  owner: Bytes!
  assets: BigInt!
  timestamp: BigInt!
}

type ProposalCreated @entity {
  id: ID!
  proposalId: BigInt!
  proposer: Bytes!
  description: String!
}

type VoteCast @entity {
  id: ID!
  voter: Bytes!
  proposalId: BigInt!
  support: Int!
  weight: BigInt!
}