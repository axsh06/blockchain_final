name: Blockchain CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master, feat/frontend-init ]

jobs:
  check:
    name: Foundry & Frontend Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Run Forge Build
        run: forge build --sizes

      - name: Run Forge Format Check
        run: forge fmt --check

      - name: Run Forge Tests
        run: forge test -vvv

      - name: Run Forge Coverage
        run: forge coverage --report summary

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Run Solhint
        run: npx solhint 'src/**/*.sol'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Prettier Check (Frontend)
        run: |
          cd frontend
          npx prettier --check "src/**/*.{ts,tsx,js,jsx,json,css}"

      - name: Run Slither 
        uses: crytic/slither-action@v0.3.0
        continue-on-error: true
        with:
          target: '.'
          slither-args: --fail-low false